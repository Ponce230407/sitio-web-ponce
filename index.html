<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Web Personal - Itzel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    header {
      background: #2c3e50;
      color: #fff;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .profile-card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 25px;
    }
    .profile-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3498db;
      margin-bottom: 15px;
    }
    section {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Perfil Personal y Ubicación</h1>
  </header>

  <!-- Sección de datos personales y fotografía -->
  <div class="profile-card">
    <img src="foto.jpg" alt="Fotografía de Itzel" class="profile-img">
    <h2>Itzel</h2>
    <p><strong>Carrera:</strong> Licenciatura en Información e Innovación Digital</p>
    <p>Estudiante apasionada por el desarrollo de software, aplicaciones móviles y proyectos de tecnología.</p>
  </div>

  <!-- Sección del Mapa Incrustado -->
  <section id="ubicacion-iframe">
    <h2>Ubicación</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15033.706278883294!2d-99.15668624999998!3d19.609052799999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2smx!4v1790219729931!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

</body>
</html>

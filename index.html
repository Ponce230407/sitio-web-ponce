<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Web Personal - Itzel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f7e8ee 0%, #f1f3f8 100%);
      color: #1f2937;
      padding: 24px 18px;
    }

    .page-shell {
      max-width: 780px;
      margin: 0 auto;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 30px 26px 26px;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .profile-img {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #6d9cf1;
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.2);
      margin-bottom: 18px;
    }

    h2 {
      color: #1f2937;
      margin-bottom: 12px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      font-weight: 800;
    }

    .lead {
      font-size: 1.02rem;
      line-height: 1.7;
      color: #4b5563;
      max-width: 560px;
      margin-bottom: 8px;
    }

    .text-accent {
      color: #2563eb;
      font-weight: 700;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.98rem;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.12);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: white;
    }

    .btn-video {
      background: linear-gradient(135deg, #f87171, #ef4444);
      color: white;
      border: none;
    }

    .video-container {
      width: 100%;
      max-width: 680px;
      margin-top: 22px;
      display: none;
    }

    video {
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 16px 34px rgba(31, 41, 55, 0.12);
      background: #000;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px 12px;
      }

      .profile-card {
        padding: 24px 18px 22px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="nav-placeholder"></div>

    <div class="profile-card">
      <img src="foto.jpg" alt="Fotografía de Itzel" class="profile-img">
      <h2>Itzel</h2>
      <p class="lead"><span class="text-accent">Carrera:</span> Licenciatura en Información e Innovación Digital</p>
      <p class="lead">Bienvenido a mi sitio web. Ayúdame respondiendo una breve encuesta sobre la UPVM.</p>

      <div class="actions">
        <a href="encuesta.html" class="btn btn-primary">Ir a la Encuesta</a>
        <a href="productos.php" class="btn btn-success">Ver Productos</a>
        <button class="btn btn-video" onclick="document.getElementById('videoPlayer').style.display='block'">Ver video</button>
      </div>

      <div id="videoPlayer" class="video-container">
        <video controls>
          <source src="Video.mp4" type="video/mp4">
          Tu navegador no soporta la reproducción de video.
        </video>
      </div>
    </div>
  </div>

  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(data => document.getElementById('nav-placeholder').innerHTML = data)
      .catch(err => console.log('Nav no disponible'));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Web Personal - Itzel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    header {
      background: #2c3e50;
      color: #fff;
      padding: 30px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .profile-card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 25px;
    }
    .profile-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3498db;
      margin-bottom: 15px;
    }
    section {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 0;
      border-radius: 8px;
    }
    #mapa {
      width: 100%;
      height: 400px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Perfil Personal y Ubicación</h1>
  </header>

  <!-- Sección de datos personales y fotografía -->
  <div class="profile-card">

    <img src="foto.jpg" alt="Fotografía de Itzel" class="profile-img">
    <h2>Itzel</h2>
    <p><strong>Carrera:</strong> Licenciatura en Información e Innovación Digital</p>
    <p>Estudiante apasionada por el desarrollo de software, aplicaciones móviles y proyectos de tecnología.</p>
  </div>

<!-- Etapa 1: Mapa incrustado con iframe -->
  <section id="ubicacion-iframe">
    <h2>Ubicación (Mapa Iframe)</h2>
    <!-- REEMPLAZA EL IFRAME DE ABAJO CON EL GENERADO DESDE GOOGLE MAPS -->
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3758.3807578297426
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </section>

  <!-- Etapa 3: Mapa interactivo con JavaScript y API Key -->
  <section id="ubicacion-javascript">
    <h2>Ubicación Interactiva (Maps JavaScript API)</h2>
    <div id="mapa"></div>
  </section>

  <script>
    function initMap() {
      // Coordenadas de ejemplo (UPVM)
      const ubicacion = { lat: 19.600122, lng: -99.167294 };
      
      const mapa = new google.maps.Map(document.getElementById("mapa"), {
        zoom: 15,
        center: ubicacion,
      });

      new google.maps.Marker({
        position: ubicacion,
        map: mapa,
        title: "Universidad Politécnica del Valle de México",
      });
    }
  </script>

  <!-- REEMPLAZA "TU_API_KEY_AQUI" CON TU CLAVE GENERADA EN GOOGLE CLOUD -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY_AQUI&callback=initMap" 
    async 
    defer>
  </script>

</body>
</html>
